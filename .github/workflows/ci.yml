# Agent rules for generation:
# https://arran4.github.io/blog/post/2026/043-canonical-github-actions-ci-cd-super-reference/
# Built using this post as reference/guidance.
name: CI/CD

on:
  push:
    branches: [main, master]
    # semantic version tags + rc/beta snapshots
    tags:
      - 'v*'
      - 'v*.*.*'
      - 'v*.*.*-rc*'
      - 'v*.*.*-beta*'
      - 'test-*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: build
        options:
          - build
          - lint-fix
          - monthly-maintenance
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - publish-tag
      release_version_override:
        type: string
        required: false
        default: ''
      allow_prs:
        type: boolean
        required: false
        default: true
  schedule:
    # preferred heavy monthly run (quota reset strategy)
    - cron: '17 3 1 * *'
    # optional nightly lightweight checks
    - cron: '41 2 * * *'

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  route:
    name: Route event
    runs-on: ubuntu-latest
    outputs:
      validation: ${{ steps.route.outputs.validation }}
      release: ${{ steps.route.outputs.release }}
      publisher: ${{ steps.route.outputs.publisher }}
      nightly: ${{ steps.route.outputs.nightly }}
      monthly: ${{ steps.route.outputs.monthly }}
      run_cleanup: ${{ steps.route.outputs.run_cleanup }}
    steps:
      - id: route
        shell: bash
        run: |
          set -euo pipefail

          validation=false
          release=false
          publisher=false
          nightly=false
          monthly=false
          run_cleanup=false

          case "${{ github.event_name }}" in
            push)
              validation=true
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                publisher=true
              fi
              ;;
            pull_request)
              if [[ "${{ github.event.action }}" == "closed" ]]; then
                run_cleanup=true
              else
                validation=true
              fi
              ;;
            workflow_dispatch)
              case "${{ inputs.mode }}" in
                lint-fix)
                  validation=true
                  nightly=true
                  ;;
                build)
                  validation=true
                  ;;
                release-*)
                  validation=true
                  release=true
                  ;;
                publish-tag)
                  if [[ "${{ github.ref_type }}" != "tag" || ! "${{ github.ref }}" =~ ^refs/tags/v.* ]]; then
                    echo "publish-tag mode requires an eligible tag context (e.g. refs/tags/v*)" >&2
                    exit 1
                  fi
                  validation=true
                  publisher=true
                  ;;
                monthly-maintenance)
                  validation=true
                  monthly=true
                  ;;
              esac
              ;;
            schedule)
              validation=true
              if [[ "${{ github.event.schedule }}" == "17 3 1 * *" ]]; then
                monthly=true
              fi
              if [[ "${{ github.event.schedule }}" == "41 2 * * *" ]]; then
                nightly=true
              fi
              ;;
          esac

          echo "validation=$validation" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "publisher=$publisher" >> "$GITHUB_OUTPUT"
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          echo "monthly=$monthly" >> "$GITHUB_OUTPUT"
          echo "run_cleanup=$run_cleanup" >> "$GITHUB_OUTPUT"

  prepare-release-tag:
    name: Prepare release tag
    needs: [route, release-ready]
    if: ${{ needs.route.outputs.release == 'true' && needs.release-ready.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-preparation
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup git-tag-inc
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'publish-tag' }}
        uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - name: Verify exact authoritative branch
        run: |
          set -euo pipefail

          AUTHORITATIVE_BRANCH="${GITHUB_REF#refs/heads/}"
          case "$AUTHORITATIVE_BRANCH" in
            main|master) ;;
            *)
              echo "Release preparation must run on main or master; got $AUTHORITATIVE_BRANCH" >&2
              exit 1
              ;;
          esac

          echo "AUTHORITATIVE_BRANCH=$AUTHORITATIVE_BRANCH" >> "$GITHUB_ENV"
          git fetch origin "$AUTHORITATIVE_BRANCH"
          ORIGIN_SHA="$(git rev-parse "origin/$AUTHORITATIVE_BRANCH")"

          if [[ "$ORIGIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "Requested release at $GITHUB_SHA but origin/$AUTHORITATIVE_BRANCH is $ORIGIN_SHA" >&2
            exit 1
          fi
      - name: Calculate or select release tag
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_VERSION_OVERRIDE: ${{ inputs.release_version_override }}
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"

          if [[ -n "$RELEASE_VERSION_OVERRIDE" ]]; then
            TAG="v${RELEASE_VERSION_OVERRIDE#v}"
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              echo "Invalid release tag: $TAG" >&2
              exit 1
            fi
          else
            case "$RELEASE_MODE" in
              release-major) level="major"; suffix="" ;;
              release-minor) level="minor"; suffix="" ;;
              release-patch) level="patch"; suffix="" ;;
              release-test)  level="patch"; suffix="test" ;;
              release-rc)    level="patch"; suffix="rc" ;;
              release-alpha) level="patch"; suffix="alpha" ;;
              *)
                echo "Unsupported release mode: $RELEASE_MODE" >&2
                exit 1
                ;;
            esac

            args=(-print-version-only "$level")
            [[ -n "$suffix" ]] && args+=("$suffix")
            TAG="$(git-tag-inc "${args[@]}")"
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Create tag idempotently
        run: |
          set -euo pipefail

          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}' || true)"
          PEELED_SHA="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}' || true)"
          [[ -n "$PEELED_SHA" ]] && REMOTE_SHA="$PEELED_SHA"

          if [[ -n "$REMOTE_SHA" ]]; then
            if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG exists at $REMOTE_SHA, expected $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Tag $TAG already points to the validated commit; continuing recovery."
            exit 0
          fi

          git fetch origin "$AUTHORITATIVE_BRANCH"
          CURRENT_ORIGIN_SHA="$(git rev-parse "origin/$AUTHORITATIVE_BRANCH")"
          if [[ "$CURRENT_ORIGIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "origin/$AUTHORITATIVE_BRANCH advanced to $CURRENT_ORIGIN_SHA before tagging" >&2
            exit 1
          fi

          git tag -d "$TAG" 2>/dev/null || true
          git tag "$TAG"
          if ! git push origin "$TAG"; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}' || true)"
            PEELED_SHA="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}' || true)"
            [[ -n "$PEELED_SHA" ]] && REMOTE_SHA="$PEELED_SHA"
            if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
              echo "Concurrent tag creation did not resolve to $GITHUB_SHA" >&2
              exit 1
            fi
          fi
      - name: Dispatch immutable tag publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "$TAG" -f mode=publish-tag

  gitleaks:
    name: Secret scan
    needs: [route]
    if: ${{ needs.route.outputs.run_cleanup != 'true' && (needs.route.outputs.nightly == 'true' || needs.route.outputs.monthly == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  golangci:
    name: lint
    needs: [route]
    if: ${{ needs.route.outputs.validation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  go-test:
    name: Go lint/test (${{ matrix.os }})
    needs: [route, golangci]
    if: ${{ needs.route.outputs.validation == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./... -v

  go-vet:
    name: Go vet
    needs: [route]
    if: ${{ needs.route.outputs.validation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  autofix:
    name: Auto-format and open PR
    needs: [route]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'lint-fix' && inputs.allow_prs == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run autofix formatters
        shell: bash
        run: |
          set -euo pipefail
          go fix ./... || true
          go fmt ./... || true
      - name: Create PR if changes exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes; exiting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PARENT_PR="${{ github.event.pull_request.number || 'none' }}"
          BRANCH="ci/autofix/${{ github.run_id }}-parent-${PARENT_PR}"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "ci: automated formatting fixes"
          git push origin "$BRANCH"

          gh pr create \
            --title "ci: automated formatting fixes" \
            --body "Automated formatting pass. Parent-PR: ${PARENT_PR}" \
            --base main \
            --head "$BRANCH" \
            --label "ci-autofix"

  cleanup-autofix-prs:
    name: Cleanup autofix PRs on parent close
    needs: [route]
    if: ${{ needs.route.outputs.run_cleanup == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr list --state open --search "label:ci-autofix in:title" --json number,headRefName,body | \
            jq -r '.[] | select(.body | contains("Parent-PR: '"$PARENT_PR"'")) | [.number, .headRefName] | @tsv' | \
            while IFS=$'\t' read -r pr branch; do
              gh pr close "$pr" --comment "Closing auto-fix PR because parent PR #$PARENT_PR was closed."
              git push origin --delete "$branch" || true
            done

  validation:
    name: Validation Aggregate
    needs: [route, golangci, go-test, go-vet]
    if: ${{ always() && needs.route.outputs.validation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected validation jobs
        env:
          WORKFLOW_RESULT: ${{ needs.golangci.result }}
          TEST_RESULT: ${{ needs.go-test.result }}
          VET_RESULT: ${{ needs.go-vet.result }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_RESULT" == "success" ]]
          [[ "$TEST_RESULT" == "success" ]]
          [[ "$VET_RESULT" == "success" ]]

  build:
    name: Build Go Binaries
    needs: [route, validation]
    if: ${{ needs.route.outputs.validation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate GoReleaser v2 configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - name: Build candidate artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -o dist/csvtrace ./cmd/csvtrace
          go build -o dist/icaltrace ./cmd/icaltrace
          go build -o dist/mailtrace ./cmd/mailtrace
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: dist/**
          if-no-files-found: error
          retention-days: 1

  artifact-smoke:
    name: Smoke Candidate Artifacts
    needs: [route, build]
    if: ${{ needs.route.outputs.validation == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: release-candidates
      - name: Smoke candidate artifacts
        run: |
          set -euo pipefail
          for cmd in csvtrace icaltrace mailtrace; do
            test -s "release-candidates/$cmd"
            chmod +x "release-candidates/$cmd"
            output="$("./release-candidates/$cmd" -help)"
            if [[ "$output" != *"Usage:"* ]]; then
              echo "Unexpected help output for $cmd" >&2
              exit 1
            fi
          done

  release-ready:
    name: Release Quality Gates Passed
    needs: [route, validation, build, artifact-smoke]
    if: ${{ always() && (needs.route.outputs.release == 'true' || needs.route.outputs.publisher == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require release gates
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SMOKE_RESULT: ${{ needs.artifact-smoke.result }}
        run: |
          set -euo pipefail
          [[ "$VALIDATION_RESULT" == "success" ]]
          [[ "$BUILD_RESULT" == "success" ]]
          [[ "$SMOKE_RESULT" == "success" ]]

  publisher:
    name: Publish With GoReleaser
    needs: [route, release-ready]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.publisher == 'true' && needs.release-ready.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Refuse duplicate or ambiguous publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]] || {
            echo "Release publisher requires a v* tag ref" >&2
            exit 1
          }
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Malformed release tag: $GITHUB_REF_NAME" >&2
            exit 1
          }
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          case "$status" in
            404) echo "No existing GitHub Release; safe to begin first publication" ;;
            200) echo "GitHub Release exists; inspect assets and recover manually instead of republishing" >&2; exit 1 ;;
            *) echo "Could not establish release state (HTTP $status); refusing publication" >&2; exit 1 ;;
          esac
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

