# Agent rules for generation:
# https://arran4.github.io/blog/post/2026/043-canonical-github-actions-ci-cd-super-reference/
# Built using this post as reference/guidance.
name: CI/CD

on:
  push:
    branches: [main, master]
    # semantic version tags + rc/beta snapshots
    tags:
      - 'v*'
      - 'v*.*.*'
      - 'v*.*.*-rc*'
      - 'v*.*.*-beta*'
      - 'test-*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: build
        options:
          - build
          - lint-fix
          - monthly-maintenance
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - publish-tag
      release_version_override:
        type: string
        required: false
        default: ''
      allow_prs:
        type: boolean
        required: false
        default: true
  schedule:
    # preferred heavy monthly run (quota reset strategy)
    - cron: '17 3 1 * *'
    # optional nightly lightweight checks
    - cron: '41 2 * * *'

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  route:
    name: Route event
    runs-on: ubuntu-latest
    outputs:
      validation: ${{ steps.route.outputs.validation }}
      release: ${{ steps.route.outputs.release }}
      publisher: ${{ steps.route.outputs.publisher }}
      nightly: ${{ steps.route.outputs.nightly }}
      monthly: ${{ steps.route.outputs.monthly }}
      run_cleanup: ${{ steps.route.outputs.run_cleanup }}
    steps:
      - id: route
        shell: bash
        run: |
          set -euo pipefail

          validation=false
          release=false
          publisher=false
          nightly=false
          monthly=false
          run_cleanup=false

          case "${{ github.event_name }}" in
            push)
              validation=true
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                publisher=true
              fi
              ;;
            pull_request)
              if [[ "${{ github.event.action }}" == "closed" ]]; then
                run_cleanup=true
              else
                validation=true
              fi
              ;;
            workflow_dispatch)
              case "${{ inputs.mode }}" in
                lint-fix)
                  validation=true
                  nightly=true
                  ;;
                build)
                  validation=true
                  ;;
                release-*)
                  validation=true
                  release=true
                  ;;
                publish-tag)
                  if [[ "${{ github.ref_type }}" != "tag" || ! "${{ github.ref }}" =~ ^refs/tags/v.* ]]; then
                    echo "publish-tag mode requires an eligible tag context (e.g. refs/tags/v*)" >&2
                    exit 1
                  fi
                  validation=true
                  publisher=true
                  ;;
                monthly-maintenance)
                  validation=true
                  monthly=true
                  ;;
              esac
              ;;
            schedule)
              validation=true
              if [[ "${{ github.event.schedule }}" == "17 3 1 * *" ]]; then
                monthly=true
              fi
              if [[ "${{ github.event.schedule }}" == "41 2 * * *" ]]; then
                nightly=true
              fi
              ;;
          esac

          echo "validation=$validation" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "publisher=$publisher" >> "$GITHUB_OUTPUT"
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          echo "monthly=$monthly" >> "$GITHUB_OUTPUT"
          echo "run_cleanup=$run_cleanup" >> "$GITHUB_OUTPUT"

  prepare-release-tag:
    name: Prepare release tag
    needs: [route, release-ready]
    if: ${{ needs.route.outputs.release == 'true' && needs.release-ready.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-preparation
      cancel-in-progress: false
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      next_version: ${{ steps.tag.outputs.next_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup git-tag-inc
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'publish-tag' }}
        uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - id: tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "next_version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MODE="${{ inputs.mode }}"
          OVERRIDE="${{ inputs.release_version_override }}"

          if [[ "$MODE" == "publish-tag" ]]; then
            # The publisher run doesn't compute new tags
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "next_version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force

          if [[ -n "$OVERRIDE" ]]; then
            OVERRIDE="${OVERRIDE#v}"
            next_tag="v$OVERRIDE"
          else
            case "$MODE" in
              release-major) level="major"; suffix="" ;;
              release-minor) level="minor"; suffix="" ;;
              release-patch) level="patch"; suffix="" ;;
              release-test)  level="patch"; suffix="test" ;;
              release-rc)    level="patch"; suffix="rc" ;;
              release-alpha) level="patch"; suffix="alpha" ;;
              *) echo "Unsupported release mode: $MODE" >&2; exit 1 ;;
            esac

            if command -v git-tag-inc >/dev/null 2>&1; then
              level="${level#-}"
              args=(-print-version-only "$level")
              [[ -n "$suffix" ]] && args+=("$suffix")
              next_tag=$(git-tag-inc "${args[@]}")
            else
              latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1)
              [[ -z "$latest" ]] && latest='0.0.0'

              if command -v npx >/dev/null 2>&1; then
                case "$level" in
                  major) bumped=$(npx --yes semver "$latest" -i major) ;;
                  minor) bumped=$(npx --yes semver "$latest" -i minor) ;;
                  *) bumped=$(npx --yes semver "$latest" -i patch) ;;
                esac
                next_tag="v${bumped}"
              else
                base="${latest%%-*}"
                IFS='.' read -r maj min pat <<< "$base"
                case "$level" in
                  major) maj=$((maj+1)); min=0; pat=0 ;;
                  minor) min=$((min+1)); pat=0 ;;
                  *) pat=$((pat+1)) ;;
                esac
                next_tag="v${maj}.${min}.${pat}"
              fi

              if [[ -n "$suffix" ]]; then
                next_tag="${next_tag}-${suffix}.1"
              fi
            fi
          fi

          [[ "$next_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || {
            echo "Invalid tag format: $next_tag" >&2
            exit 1
          }

          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            # Safe recovery semantics: verify existing tag against remote
            REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$next_tag" | awk '{print $1}')
            if [[ "$REMOTE_TAG_SHA" == "${GITHUB_SHA}" ]]; then
              echo "Tag $next_tag exists and points to GITHUB_SHA. Safe to retry."
            else
              echo "Tag already exists and points to $REMOTE_TAG_SHA (expected ${GITHUB_SHA}): $next_tag" >&2
              echo "To retry a failed publication for this exact version, ensure release_version_override is used and GITHUB_SHA matches." >&2
              exit 1
            fi
          fi

          echo "release_tag=$next_tag" >> "$GITHUB_OUTPUT"
          clean_tag="${next_tag#v}"; clean_tag="${clean_tag%%-*}"
          IFS='.' read -r maj min pat <<< "$clean_tag"
          echo "next_version=${maj:-0}.${min:-0}.$(( ${pat:-0} + 1 ))-SNAPSHOT" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Secret scan
    needs: [route]
    if: ${{ needs.route.outputs.run_cleanup != 'true' && (needs.route.outputs.nightly == 'true' || needs.route.outputs.monthly == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  golangci:
    name: lint
    needs: [route]
    if: ${{ needs.route.outputs.validation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  go-test:
    name: Go lint/test (${{ matrix.os }})
    needs: [route, golangci]
    if: ${{ needs.route.outputs.validation == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./... -v

  go-vet:
    name: Go vet
    needs: [route]
    if: ${{ needs.route.outputs.validation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  autofix:
    name: Auto-format and open PR
    needs: [route]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'lint-fix' && inputs.allow_prs == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run autofix formatters
        shell: bash
        run: |
          set -euo pipefail
          go fix ./... || true
          go fmt ./... || true
      - name: Create PR if changes exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes; exiting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PARENT_PR="${{ github.event.pull_request.number || 'none' }}"
          BRANCH="ci/autofix/${{ github.run_id }}-parent-${PARENT_PR}"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "ci: automated formatting fixes"
          git push origin "$BRANCH"

          gh pr create \
            --title "ci: automated formatting fixes" \
            --body "Automated formatting pass. Parent-PR: ${PARENT_PR}" \
            --base main \
            --head "$BRANCH" \
            --label "ci-autofix"

  cleanup-autofix-prs:
    name: Cleanup autofix PRs on parent close
    needs: [route]
    if: ${{ needs.route.outputs.run_cleanup == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr list --state open --search "label:ci-autofix in:title" --json number,headRefName,body | \
            jq -r '.[] | select(.body | contains("Parent-PR: '"$PARENT_PR"'")) | [.number, .headRefName] | @tsv' | \
            while IFS=$'\t' read -r pr branch; do
              gh pr close "$pr" --comment "Closing auto-fix PR because parent PR #$PARENT_PR was closed."
              git push origin --delete "$branch" || true
            done

  validation:
    name: Validation Aggregate
    needs: [route, golangci, go-test, go-vet]
    if: ${{ always() && needs.route.outputs.validation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected validation jobs
        env:
          WORKFLOW_RESULT: ${{ needs.golangci.result }}
          TEST_RESULT: ${{ needs.go-test.result }}
          VET_RESULT: ${{ needs.go-vet.result }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_RESULT" == "success" ]]
          [[ "$TEST_RESULT" == "success" ]]
          [[ "$VET_RESULT" == "success" ]]

  release-ready:
    name: Release Quality Gates Passed
    needs: [route, validation]
    if: ${{ always() && (needs.route.outputs.release == 'true' || needs.route.outputs.publisher == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require release gates
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          set -euo pipefail
          [[ "$VALIDATION_RESULT" == "success" ]]

  release-context:
    name: Release Context
    needs: [route, prepare-release-tag]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      release_tag: ${{ steps.export.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize and push tag
        id: export
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ needs.prepare-release-tag.outputs.release_tag }}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "publish-tag" ]]; then
            if [[ "${{ github.ref_type }}" != "tag" ]]; then
              echo "Error: publish-tag mode invoked on a non-tag ref." >&2
              exit 1
            fi
            echo "Running in internal publisher mode; tag is immutable context."
            exit 0
          fi

          git fetch --tags --force
          REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')

          if [[ -n "$REMOTE_TAG_SHA" ]]; then
            if [[ "$REMOTE_TAG_SHA" == "${GITHUB_SHA}" ]]; then
              echo "Tag $TAG already exists on remote and points to the correct SHA. Continuing safely."
            else
              echo "Tag $TAG already exists on remote but points to a different commit ($REMOTE_TAG_SHA). Failing." >&2
              exit 1
            fi
          else
            git tag "$TAG" "${GITHUB_SHA}"
            git push origin "$TAG" || (
              VERIFY_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
              if [[ "$VERIFY_SHA" == "${GITHUB_SHA}" ]]; then
                echo "Tag successfully verified on remote after push error."
              else
                echo "Tag push failed and remote verification failed." >&2
                exit 1
              fi
            )
          fi

          # Explicitly dispatch the publisher workflow at the new tag ref
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            gh workflow run "ci.yml" --ref "$TAG" -f mode="publish-tag"
          fi

  publisher:
    name: Publish With GoReleaser
    needs: [route, release-ready]
    if: ${{ !failure() && !cancelled() && needs.route.outputs.publisher == 'true' && needs.release-ready.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

